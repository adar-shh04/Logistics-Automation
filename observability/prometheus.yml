global:
  scrape_interval: 2s
  evaluation_interval: 2s

scrape_configs:
  - job_name: "logistics_api"
    metrics_path: "/actuator/prometheus"
    static_configs:
      - targets: ["api:8000"]

  - job_name: "logistics_workers"
    dns_sd_configs:
      - names:
          - "worker"
        type: "A"
        port: 9100
        refresh_interval: 2s
