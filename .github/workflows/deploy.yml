name: Deploy to Amazon ECR

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  build-and-push-ecr:
    name: Build & Push Images to ECR
    runs-on: ubuntu-latest
    # Kept disabled until repository owner creates the OIDC role via Terraform in Phase C3
    if: false
    env:
      AWS_REGION: ap-south-1

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Logistics API Image
        uses: docker/build-push-action@v5
        with:
          context: ./api-java
          push: true
          tags: ${{ steps.login-ecr.outputs.registry }}/logistics-api:latest,${{ steps.login-ecr.outputs.registry }}/logistics-api:${{ github.sha }}

      - name: Build and Push Logistics Worker Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ${{ steps.login-ecr.outputs.registry }}/logistics-worker:latest,${{ steps.login-ecr.outputs.registry }}/logistics-worker:${{ github.sha }}

      - name: Build and Push Logistics Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile.prod
          build-args: |
            VITE_API_URL=/api
          push: true
          tags: ${{ steps.login-ecr.outputs.registry }}/logistics-frontend:latest,${{ steps.login-ecr.outputs.registry }}/logistics-frontend:${{ github.sha }}

      # Runs deploy/remote_deploy.sh on the instance through SSM Run Command.
      # Repository variables needed: AWS_DEPLOY_ROLE_ARN, EC2_INSTANCE_ID,
      # S3_BUCKET (Terraform output s3_bucket_name) and, only with RDS,
      # DB_HOST (rds_endpoint host). No secrets pass through this workflow:
      # the instance reads them from SSM with its own role.
      - name: Deploy to EC2 via SSM
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
          S3_BUCKET: ${{ vars.S3_BUCKET }}
          DB_HOST: ${{ vars.DB_HOST || 'db' }}
        run: |
          SCRIPT_URL="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_SHA}/deploy/remote_deploy.sh"
          CMD="curl -fsSL ${SCRIPT_URL} -o /tmp/remote_deploy.sh && bash /tmp/remote_deploy.sh ${GITHUB_SHA} ${REGISTRY} ${S3_BUCKET} ${AWS_REGION} ${DB_HOST}"
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "deploy ${GITHUB_SHA}" \
            --parameters "commands=[\"${CMD}\"]" \
            --query Command.CommandId --output text)
          echo "SSM command: $COMMAND_ID"
          for i in $(seq 1 60); do
            STATUS=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" --query Status --output text 2>/dev/null || echo Pending)
            case "$STATUS" in
              Success) echo "deploy succeeded"; break ;;
              Failed|Cancelled|TimedOut) echo "deploy $STATUS"; \
                aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
                  --query StandardErrorContent --output text; exit 1 ;;
              *) sleep 10 ;;
            esac
          done
          [ "$STATUS" = "Success" ] || { echo "deploy did not finish in 10 minutes"; exit 1; }
