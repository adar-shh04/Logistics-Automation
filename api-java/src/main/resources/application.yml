spring:
  datasource:
    url: ${DATABASE_URL_JDBC:jdbc:postgresql://localhost:5432/trade_db}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

app:
  upload-dir: ${UPLOAD_DIR:/data/uploads}
  jobs-stream: ${JOBS_STREAM:logistics:jobs}
  storage:
    type: ${STORAGE_TYPE:s3}
    s3:
      bucket: ${S3_BUCKET:logistics-uploads}
      region: ${AWS_REGION:ap-south-1}
      endpoint: ${S3_ENDPOINT_URL:http://localstack:4566}
      path-style-access: ${S3_PATH_STYLE_ACCESS:true}
      access-key: ${AWS_ACCESS_KEY_ID:test}
      secret-key: ${AWS_SECRET_ACCESS_KEY:test}

server:
  port: 8000

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    distribution:
      percentiles-histogram:
        http:
          server:
            requests: true
