spring:
  datasource:
    url: ${DATABASE_URL_JDBC:jdbc:postgresql://localhost:5432/trade_db}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

app:
  upload-dir: ${UPLOAD_DIR:/data/uploads}
  jobs-stream: logistics:jobs

server:
  port: 8000

management:
  endpoints:
    web:
      exposure:
        include: health,info
