services:
  db:
    image: postgres:15
    container_name: logistics_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: trade_db
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d trade_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: logistics_redis
    ports:
      - "6379:6379"
    restart: unless-stopped

  localstack:
    image: localstack/localstack:3.0
    container_name: logistics_s3
    ports:
      - "4566:4566"
    environment:
      - SERVICES=s3
      - AWS_DEFAULT_REGION=ap-south-1
    volumes:
      - ./infra/localstack/init-s3.sh:/etc/localstack/init/ready.d/init-s3.sh
    restart: unless-stopped

  api:
    build:
      context: ./api-java
    container_name: logistics_api
    environment:
      - DATABASE_URL_JDBC=jdbc:postgresql://db:5432/trade_db
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - UPLOAD_DIR=/data/uploads
      - STORAGE_TYPE=${STORAGE_TYPE:-s3}
      - S3_BUCKET=${S3_BUCKET:-logistics-uploads}
      - AWS_REGION=${AWS_REGION:-ap-south-1}
      - S3_ENDPOINT_URL=http://localstack:4566
      - S3_PATH_STYLE_ACCESS=true
      - AWS_ACCESS_KEY_ID=${S3_LOCAL_ACCESS_KEY:-test}
      - AWS_SECRET_ACCESS_KEY=${S3_LOCAL_SECRET_KEY:-test}
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/actuator/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      localstack:
        condition: service_started
    restart: unless-stopped

  worker:
    build:
      context: ./backend
    command: python -m app.stream_worker
    volumes:
      - ./backend/app:/app
      - ./backend/app/hsdata:/app/hsdata
      - ./backend/models:/app/models
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/trade_db
      - REDIS_URL=redis://redis:6379/0
      - HS_CSV=/app/hsdata/hs_codes.csv
      - UPLOAD_DIR=/data/uploads
      - LEDGER_FILE=/app/models/ledger.txt
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - S3_ENDPOINT_URL=http://localstack:4566
      - AWS_REGION=${AWS_REGION:-ap-south-1}
      - AWS_ACCESS_KEY_ID=${S3_LOCAL_ACCESS_KEY:-test}
      - AWS_SECRET_ACCESS_KEY=${S3_LOCAL_SECRET_KEY:-test}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      api:
        condition: service_healthy
      localstack:
        condition: service_started
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    container_name: logistics_frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
      - VITE_API_URL=http://localhost:8000
    depends_on:
      api:
        condition: service_started
    restart: unless-stopped

volumes:
  db_data:
  frontend_node_modules:
