services:
  db:
    image: postgres:15
    container_name: logistics_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: trade_db
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d trade_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: logistics_redis
    ports:
      - "6379:6379"
    restart: unless-stopped

  api:
    build:
      context: ./api-java
    container_name: logistics_api
    environment:
      - DATABASE_URL_JDBC=jdbc:postgresql://db:5432/trade_db
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - UPLOAD_DIR=/data/uploads
    volumes:
      - ./sample_docs:/data/uploads
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/actuator/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  worker:
    build:
      context: ./backend
    container_name: logistics_worker
    command: python -m app.stream_worker
    volumes:
      - ./backend/app:/app
      - ./sample_docs:/data/uploads
      - ./backend/app/hsdata:/app/hsdata
      - ./backend/models:/app/models
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/trade_db
      - REDIS_URL=redis://redis:6379/0
      - HS_CSV=/app/hsdata/hs_codes.csv
      - UPLOAD_DIR=/data/uploads
      - LEDGER_FILE=/app/models/ledger.txt
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      api:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    container_name: logistics_frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
      - VITE_API_URL=http://localhost:8000
    depends_on:
      api:
        condition: service_started
    restart: unless-stopped

volumes:
  db_data:
  frontend_node_modules:
